{% extends 'accounts/base.html' %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your portal</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="alert-toast alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <div class="input-wrapper">
                <input type="text" name="username" id="id_username" placeholder="Enter username" required autofocus>
            </div>
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <div class="input-wrapper">
                <input type="password" name="password" id="id_password" placeholder="Enter password" required>
            </div>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="footer-link">
        Don't have an account? <a href="{% url 'register' %}">Create Account</a>
    </div>
</div>
{% endblock %}
